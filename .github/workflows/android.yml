name: Build Android

on:
  workflow_dispatch: {}
  push:
    branches:
      - master
      - main
    paths:
      - 'lib/**'
      - 'android/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/android.yml'

permissions:
  contents: write

jobs:
  build_android:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.6'
          cache: true

      # runner 镜像已预装 Android SDK 且 licenses 已接受；
      # 不使用 android-actions/setup-android：其内部会安装已下架的 tools 包而失败
      - name: Install NDK required by android/app/build.gradle
        run: |
          if ! command -v sdkmanager >/dev/null 2>&1; then
            export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          fi
          yes | sdkmanager --install "ndk;28.0.13004108"
          sdkmanager --list_installed | grep -i 'ndk;' || true

      - name: Restore signing keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore

      - name: Write android/key.properties
        run: |
          cat > android/key.properties <<EOF
          storeFile=release.keystore
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Show toolchain versions
        run: |
          flutter --version
          java -version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build release APK
        run: |
          # 版本名来自 pubspec.yaml, 发版时只改那一处;
          # versionCode = pubspec 的 `+基数` + CI 构建号, 保证单调递增(覆盖安装需要)。
          # 基数必须大于历史上发布过的任何 versionCode, 否则会被系统判定为降级而拒绝安装。
          BASE=$(grep -m1 '^version:' pubspec.yaml | sed 's/^version:[[:space:]]*//; s/.*+//')
          BUILD_NUMBER=$((BASE + GITHUB_RUN_NUMBER))
          echo "versionCode = $BUILD_NUMBER (base $BASE + run $GITHUB_RUN_NUMBER)"
          flutter build apk --release \
            --build-number=$BUILD_NUMBER

      - name: Rename APKs with version
        run: |
          # 产物文件名带上版本名与构建号, 下载到手机后可直接区分新旧包
          VERSION="$(grep -m1 '^version:' pubspec.yaml | sed 's/^version:[[:space:]]*//; s/+.*//')"
          SUFFIX="-${VERSION}-build${GITHUB_RUN_NUMBER}"
          echo "文件名后缀: ${SUFFIX}.apk"
          for dir in build/app/outputs/flutter-apk build/app/outputs/apk/release; do
            [ -d "$dir" ] || continue
            for f in "$dir"/*.apk; do
              [ -e "$f" ] || continue
              case "$f" in
                *"${SUFFIX}.apk") continue ;;
              esac
              mv "$f" "${f%.apk}${SUFFIX}.apk"
            done
          done
          ls -l build/app/outputs/flutter-apk/ build/app/outputs/apk/release/ 2>/dev/null || true

      - name: Generate checksums
        run: |
          cd build/app/outputs/flutter-apk
          sha256sum *.apk > SHA256SUMS
          cat SHA256SUMS

      - name: Upload APKs as artifact
        uses: actions/upload-artifact@v4
        with:
          name: PicaComic-APK
          if-no-files-found: error
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/flutter-apk/SHA256SUMS
            build/app/outputs/apk/release/*.apk

      - name: Publish APKs to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          BUILD_NO="${GITHUB_RUN_NUMBER}"
          SHORT_SHA="$(git rev-parse --short HEAD)"

          # 版本名统一从 pubspec.yaml 读取(发版时只改那一处)
          VERSION="$(grep -m1 '^version:' pubspec.yaml | sed 's/^version:[[:space:]]*//; s/+.*//')"
          # 每个版本一个 Release: 同版本重复构建追加到同一个 Release, 历史版本互不覆盖
          TAG="v${VERSION}"
          echo "release version: $VERSION   tag: $TAG"

          # tag 指向本次构建的源码, 这样 Release 页面上显示的 commit 才是对的。
          # 用 API 而不是 git push: GITHUB_TOKEN 没有 workflow scope,
          # 提交里含 .github/workflows 文件时推送会被拒绝。
          # 先按"移动"处理(同版本重复构建), 失败说明 tag 还不存在, 再创建。
          gh api --method PATCH "/repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}" \
            -f sha="${GITHUB_SHA}" -F force=true >/dev/null 2>&1 \
            || gh api --method POST "/repos/${GITHUB_REPOSITORY}/git/refs" \
                 -f ref="refs/tags/${TAG}" -f sha="${GITHUB_SHA}" >/dev/null 2>&1 \
            || echo "tag ${TAG} 已存在或创建失败, 继续发布"

          # 生成更新说明: 只贴当前版本那一段 + 通用安装说明。
          # 版本段按 "### <版本名>" 分段维护在 .github/release_notes.md,
          # 通用段(安装说明/与原版的关系)在 .github/install_notes.md。
          NOTES=release_notes.md
          {
            echo "## PicaComic Mod · ${VERSION}"
            echo ""
            echo "构建 **#${BUILD_NO}** ｜ 源码 \`${SHORT_SHA}\` ｜ $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo ""
            awk -v v="### ${VERSION}" 'index($0,v)==1 {p=1} p && /^### / && index($0,v)!=1 {exit} p' .github/release_notes.md
            echo ""
            cat .github/install_notes.md
          } > "$NOTES"

          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
                 --title "PicaComic Mod ${VERSION}" --notes "pending"

          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
            --title "PicaComic Mod ${VERSION} (build ${BUILD_NO})" \
            --notes-file "$NOTES"

          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            build/app/outputs/flutter-apk/*.apk \
            build/app/outputs/flutter-apk/SHA256SUMS

          echo "--- release assets ---"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[] | "\(.name) | \((.size/1048576*100|round)/100) MB"'
